name: View
description: 'View, Inc. is a smart-glass and smart-building technology company founded in 2007 and
  headquartered in Milpitas, California, with manufacturing in Olive Branch, Mississippi. View makes
  View Dynamic Glass, electrochromic architectural windows whose tint adjusts automatically to sunlight,
  glare, and heat, alongside a connected Smart Building Platform in which each pane is individually
  IP-addressable and app-controllable and layered with sensors and services such as SmartProtect (an
  Azure IoT integration that alerts building managers when glass breaks). Backed by the SoftBank Vision
  Fund, View went public via SPAC in 2021 and filed for Chapter 11 bankruptcy in 2024, transitioning
  back to private ownership under its lenders. View exposes no public developer API surface; its GitHub
  organization (viewinc) mirrors third-party C/C++ and IoT firmware libraries used internally rather
  than first-party SDKs.'
